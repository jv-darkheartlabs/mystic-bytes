function readPacket(text) {
 const file=JSON.parse(text);
 const integer=(value,max)=>Number.isInteger(value)&&value>=0&&value<=max;
 if(file?.schema!==schema || !Array.isArray(file.importance) || file.importance.length!==weights.length ||
  !weights.every((_,i)=>integer(file.importance[i],5)&&file.importance[i]>0))throw Error("Use a complete comparison file from this version of Life Together.");
 const answers={};
 weights.forEach((w,i)=>answers[w.id]=file.importance[i]-1);
 for(const q of scenarios){
  const max=q.options.length-1;
  if(q.descriptive){
   const a=file.descriptive?.[q.id];
   if(!a || !integer(a.answer,max))throw Error("The file is missing a personal preference answer.");
   answers[q.id]=a.answer;
   if(a.condition!==undefined){
    if(!integer(a.condition,conditions.length-1))throw Error("The file is missing a personal preference follow-up.");
    answers["condition-"+q.id]=a.condition;
   }
   continue;
  }
  const a=file.relationship?.[q.id];
  if(!a || !integer(a.pref,max) || !integer(a.firm,1) || !Array.isArray(a.accept) || !a.accept.length ||
   !a.accept.every(i=>integer(i,max)) || !a.accept.includes(a.pref))throw Error("The file has an invalid relationship answer.");
  const depends=a.condition!==undefined;
  if(depends&&!integer(a.condition,conditions.length-1))throw Error("The file is missing a relationship follow-up.");
  answers[q.id]={pref:a.pref,accept:[...new Set(a.accept)],firm:a.firm,...(depends?{condition:a.condition}:{})};
 }
 for(const q of [...baseItems,...extras]){
  const answer=file.responses?.[q.id];
  if(answer===undefined&&extras.includes(q))continue;
  if(!integer(answer,q.options.length-1))throw Error("The file is missing a profile answer.");
  answers[q.id]=answer;
  if(file.followups?.[q.id]!==undefined){
   const condition=file.followups?.[q.id];
   if(!integer(condition,conditions.length-1))throw Error("The file is missing a profile follow-up.");
   answers["condition-"+q.id]=condition;
  }
 }
 for(const q of extras)if(needsExtra(q,answers)&&!Object.hasOwn(answers,q.id))throw Error("The file is missing a required profile follow-up.");
 for(const q of contextItems){
  const data=file.context?.[q.id];
  if(data===undefined)continue;
  if(!Array.isArray(data)||data.length!==2||!integer(data[0],q.options.length-1)||(data[1]!==null&&!integer(data[1],conditions.length-1)))throw Error("The file has an invalid context answer.");
  answers[q.id]=data[0];
  if(data[1]!==null)answers["condition-"+q.id]=data[1];
 }
 const validated=packet(answers);
 validated.interests=validateInterests(file.interests);
 validated.known={};
 for(const key of knownFrameworks){
  const value=file.known?.[key];
  if(typeof value==="string"&&value.length<=80)validated.known[key]=value;
 }
 return validated;
}

 for(const [id,data] of Object.entries(file.descriptive)){
  restored[id]=data.answer;
  if(data.condition!==undefined)restored["condition-"+id]=data.condition;

  restored[id]=answer;

  event.preventDefault();
  const data=new FormData(event.currentTarget);
  try{
   comparison(own||decodeCode(data.get("you")),decodeCode(data.get("partner")),()=>importView(own,back));
  }catch(error){
   app.querySelector("#error").textContent=error instanceof SyntaxError?"This comparison code could not be read. Copy the complete code and try again.":error.message;
  }
 };
}
function compareScenario(q,a,b){
 const shared=a.accept.filter(i=>b.accept.includes(i));
 const points=a.pref===b.pref?100:shared.length?75:0;
 return {q,a,b,shared,points,firm:points===0&&a.firm===1&&b.firm===1};
}
function summarize(you,partner) {
 const findings=scenarios.filter(q=>!q.descriptive).map(q=>compareScenario(q,you.relationship[q.id],partner.relationship[q.id]));
 const weighted=scoredTopics.map((topic,i)=>{
  const rows=findings.filter(f=>f.q.topic===topic);
  return {topic,value:rows.reduce((sum,f)=>sum+f.points,0)/rows.length,weight:(you.importance[i]+partner.importance[i])/2};
 });
 const score=Math.round(weighted.reduce((sum,t)=>sum+t.value*t.weight,0)/weighted.reduce((sum,t)=>sum+t.weight,0));
 return {score,findings,weighted};
}
function flowcharts(you,partner) {
 const followThrough=["Agree on what would help and when you’ll check in.","Set an expectation for when reassurance or a reply is possible.","Name the hesitation and agree on a low-pressure way to reconnect.","Say when you’ll return to the conversation after taking space.","Agree on when an independent response needs a shared check-in."];
 return attachmentScenarios.map((scenario,i)=>'<details><summary>'+escape(scenario)+'</summary>'+
 ["Typical day","Under stress"].map((context,j)=>{
  const id="a"+i+j;
  const a=you.responses[id], b=partner?.responses[id], options=[...attachment,...open];
  if(!partner)return '<div class="path"><h3>'+context+'</h3><p>'+escape(options[a])+'</p><p>↓ '+escape(followThrough[a])+'</p></div>';
  const seek=i=>i===0||i===1, withdraw=i=>i===2||i===3||i===4;
  const effect=(seek(a)&&withdraw(b))||(seek(b)&&withdraw(a))?"One person may reach out while the other delays contact. A check-in time could make space predictable.":
   withdraw(a)&&withdraw(b)?"Both may wait for the other person to make contact. Decide who will reopen the conversation.":
   a===b?followThrough[a]:"Both may try to make contact with different timing or intensity. Ask what kind of response would help first.";
  return '<div class="path"><h3>'+context+'</h3><p><strong>You</strong> '+escape(options[a])+'<br><strong>Partner</strong> '+escape(options[b])+'</p><p>↓ '+escape(effect)+'</p></div>';
 }).join("")+'</details>').join("");
}
function comparison(you,partner,compareAgain=()=>importView()) {
 const {score,findings,weighted}=summarize(you,partner);
 const firm=findings.filter(f=>f.firm);
 const topicWeights=Object.fromEntries(weighted.map(t=>[t.topic,t.weight]));
 const describeFinding=f=>'<details'+(f.points<100||intimacy.includes(f)?' open':'')+'><summary>'+escape(f.q.topic)+' · '+escape(f.q.prompt)+'</summary>'+
  '<p><strong>'+({100:"Shared preference",75:"Mutually acceptable option",0:"No shared option"}[f.points])+'</strong> · '+f.points+' points'+
  (f.firm?' · <span class="warning">Opposing firm requirements</span>':'')+'</p>'+
  (f.a.pref!==f.b.pref && f.a.pref<f.q.options.length && f.b.pref<f.q.options.length?'<p>'+escape(f.q.friction)+'</p>':'')+
  '<div class="grid"><div class="card"><strong>You</strong><br>'+describe(f.q,f.a)+'</div><div class="card"><strong>Partner</strong><br>'+describe(f.q,f.b)+'</div></div>'+
  (f.shared.length?'<p><strong>Both could accept</strong> '+list(f.shared.map(i=>f.q.options[i]))+'</p>':'')+'</details>';
 const intimacy=findings.filter(f=>["Sexual intimacy","Emotional connection","Consensual roles and interests","Relationship structure and boundaries"].includes(f.q.topic));
 const boundaries=intimacy.filter(f=>f.a.firm||f.b.firm);
 const intimacyOverview='<div class="grid">'+intimacyBars(you,"Your intimacy profile")+intimacyBars(partner,"Other person’s intimacy profile")+'</div>'+venn(intimacy)+reportTable(["Intimacy boundary","You","Other person"],boundaries.map(f=>[escape(f.q.prompt),f.a.firm?list(f.a.accept.map(i=>f.q.options[i])):"—",f.b.firm?list(f.b.accept.map(i=>f.q.options[i])):"—"]));
 const visuals=topicGrid(findings)+compareInterests(you.interests,partner.interests)+scenarioVenn(findings,"Scenario agreement")+sharedCare(you,partner,findings)+
 '<h2>Intimacy and boundaries</h2>'+intimacyOverview+sharedBigFive(you,partner)+attachmentSection(you,partner)+
 '<h2>Animal Symbols</h2><div class="grid">'+[["You",you],["Other person",partner]].map(([label,file])=>'<div><h3>'+label+'</h3>'+animalSymbol(file,file.behavior||[])+'</div>').join("")+'</div>';
 const differences=findings.filter(f=>f.points<100).sort((a,b)=>Number(b.firm)-Number(a.firm)||a.points-b.points||topicWeights[b.q.topic]-topicWeights[a.q.topic]);
 view("Shared comparison",'<div class="card"><div class="mono">Overall compatibility score</div><strong class="score">'+score+' / 100</strong>'+
  (firm.length?'<p class="warning"><strong>Opposing firm requirements</strong></p><ul>'+firm.map(f=>'<li>'+escape(f.q.prompt)+'<br>You require '+list(f.a.accept.map(i=>f.q.options[i]))+'. Your partner requires '+list(f.b.accept.map(i=>f.q.options[i]))+'.</li>').join("")+'</ul>':'')+
  '<p>Based on '+findings.length+' scored scenarios and both people’s topic ratings.</p></div>'+
  '<div class="actions"><button id="pdf">Save shared results as PDF</button><button id="compare">Compare other codes</button><button id="home">Quiz home</button></div>'+
  visuals+'<details><summary>Overlap by topic</summary>'+weighted.map(t=>'<h3>'+escape(t.topic)+'</h3>'+venn(findings.filter(f=>f.q.topic===t.topic))).join('')+'</details>'+
  '<h2>Differences to discuss</h2>'+(differences.map(describeFinding).join("")||'<p>Your preferred arrangements match in every scenario.</p>')+
  '<h2>Areas of agreement</h2>'+(findings.filter(f=>f.points===100).map(describeFinding).join("")||'<p>Any mutually acceptable options are listed with the differences above.</p>')+
  chart("Compatibility by topic",weighted.map(t=>[t.topic,Math.round(t.value)]))+
  '<details><summary>Topic scores and importance</summary><ul>'+weighted.map((t,i)=>'<li>'+escape(t.topic)+' · '+Math.round(t.value)+'/100 · your importance '+you.importance[i]+'/5 · partner’s '+partner.importance[i]+'/5</li>').join("")+'</ul></details>'+
  '<h2>Attraction, care, and personal preferences</h2><p>These answers describe each person’s experience. The score uses shared arrangements.</p>'+
  personalItems.map(q=>'<details open><summary>'+escape(q.prompt)+'</summary><div class="grid"><div class="card"><strong>You</strong><br>'+
   describePersonal(q,you.descriptive[q.id])+'</div><div class="card"><strong>Partner</strong><br>'+describePersonal(q,partner.descriptive[q.id])+'</div></div></details>').join("")+
  '<details><summary>All answers · You</summary>'+responseList(you)+'</details><details><summary>All answers · Other person</summary>'+responseList(partner)+'</details>'+
  compareBehavior(you.behavior,partner.behavior)+
  '<h2>Profile estimates</h2><p class="muted">These short, original item sets give provisional estimates. Profiles are displayed as context for discussion. The compatibility score uses relationship answers and topic ratings.</p>'+
  sharedProfiles(you,partner));
 app.querySelector("#pdf").onclick=()=>printPreview("Shared comparison · PDF preview",(includeIntimacy,appendix)=>{
  const include=q=>includeIntimacy||!intimacyTopics.has(q.topic);
  const shown=findings.filter(f=>include(f.q)), conflicts=shown.filter(f=>f.firm), topicsShown=weighted.filter(include);
  const visibleScore=Math.round(topicsShown.reduce((sum,t)=>sum+t.value*t.weight,0)/topicsShown.reduce((sum,t)=>sum+t.weight,0));
  return '<p class="score">'+(includeIntimacy?"Compatibility":"Compatibility across included topics")+' '+visibleScore+' / 100</p>'+
   (conflicts.length?'<h2>Opposing firm requirements</h2>'+conflicts.map(describeFinding).join(""):"")+
   topicGrid(shown)+compareInterests(you.interests,partner.interests)+scenarioVenn(shown,"Scenario agreement")+sharedCare(you,partner,shown)+
   (includeIntimacy?'<h2>Intimacy and boundaries</h2>'+intimacyOverview:"")+
   sharedBigFive(you,partner)+attachmentSection(you,partner)+sharedProfiles(you,partner)+behaviorCounts(you.behavior,partner.behavior)+
   (appendix?'<h2>Detailed appendix</h2>'+shown.map(describeFinding).join("")+compareBehavior(you.behavior,partner.behavior)+
    '<h2>You</h2>'+responseList(you,include)+'<h2>Other person</h2>'+responseList(partner,include):"");
 },()=>comparison(you,partner,compareAgain));
 app.querySelector("#compare").onclick=compareAgain;
 app.querySelector("#home").onclick=home;
}
function sampleFile(person) {
 const answers={};
 scenarios.forEach(q=>answers[q.id]=q.descriptive?person:{pref:0,accept:[0,1],firm:0});
 weights.forEach((q,i)=>answers[q.id]=i<2?4:2);
 baseItems.forEach((q,i)=>answers[q.id]=(i+person)%q.options.length);
 contextItems.forEach((q,i)=>answers[q.id]=(i+person)%q.options.length);
 extras.forEach(q=>{if(needsExtra(q,answers))answers[q.id]=person;});
 answers["r1-0"]=person?{pref:2,accept:[1,2],firm:0}:{pref:1,accept:[1],firm:1};
 answers["r6-0"]={pref:person,accept:[person],firm:1};
 if(person)answers["r0-0"]={pref:3,accept:[3],firm:0,condition:1};
 return {...packet(answers),behavior:Array.from({length:behaviorCount},(_,i)=>i%7===0?[2,person,1,null]:[i%2,(i+person)%4,person,1])};
}

home();
