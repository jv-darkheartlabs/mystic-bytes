<footer class="site-footer"><div class="site-footer__inner"><div class="site-footer__grid">
<div><div class="site-footer__label">Dark Heart Labs</div><a class="site-footer__brand-link" href="{{ '/' | relative_url }}">{% include brand-lockup.html variant='footer' %}</a><p>{{ site.tagline }}</p></div>
<div><div class="site-footer__label">Contact and links</div><ul class="site-footer__links"><li><a href="mailto:{{ site.data.career.email }}">Email</a></li><li><a href="tel:{{ site.data.career.phone_href }}">{{ site.data.career.phone }}</a></li><li><a href="{{ site.data.site.social.linkedin }}" rel="me noreferrer">LinkedIn</a></li><li><a href="{{ site.data.site.social.github }}" rel="me noreferrer">GitHub</a></li></ul></div>
<div><div class="site-footer__label">Location</div><p>{{ site.data.site.location }}</p><p class="site-footer__muted">© {{ 'now' | date: '%Y' }} Jennifer Picado</p></div>
</div></div></footer>
