name: Jennifer Picado
headline: Senior Technical Writer
location_line: "Remote · async (US and New Zealand)"
intro: "Senior technical writer who turns messy implementation notes into how-to articles a tired first-time user can finish. Writes incident explanations and customer-facing copy when DNS, email, or deploys break. Comfortable sitting next to hosting, Docker, and mail setup long enough to document them accurately — applying for a writing seat, not an engineering one."
core_fit:
  - label: How-to writing
    value: "Task-oriented articles, knowledge base, READMEs, and checklists written in the voice of a blocked first-time user"
  - label: Incident & customer copy
    value: "Incident notes and customer-facing explanations when mail, DNS, or deploys fail — action first, jargon last"
  - label: Domain literacy
    value: "DNS · email deliverability (SPF / DKIM / DMARC) · hosting · Docker — enough to document the system without waiting on an engineer for every sentence"
  - label: Docs craft
    value: "Markdown · Git · GitHub · WordPress · Drupal · plain language · accessibility-aware help text"
