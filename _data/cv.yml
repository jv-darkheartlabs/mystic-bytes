anzsco:
  212415:
    title: Technical Writer
    role: Primary nominated occupation
    summary: "Researches and writes technical information-based material and documentation for articles, manuals, handbooks, and multimedia products, usually for education or corporate purposes."
    duties:
      - Research technical systems and turn them into task-oriented how-to articles
      - Write and maintain user guides, READMEs, knowledge-base articles, and handbooks
      - Edit drafts for plain language, accuracy, and a first-time-user reading path
      - Write incident notes and customer-facing explanations when systems fail
      - Document hosting, registrar DNS, mail authentication, and remote break-fix so a non-specialist can complete the task
  261212:
    title: Web Developer
    role: Related capability — use when the job is web delivery with a docs load
    summary: "Plans, produces and maintains websites using web programming languages, software applications, technologies and databases together with specifications of user needs."
    duties:
      - Build and maintain accessible HTML/CSS/JavaScript and Jekyll sites
      - Implement responsive front end and in-product help text
      - Document CMS and publishing workflows so a client can ship without a developer on the call
