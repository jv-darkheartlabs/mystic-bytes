tagline: "contract work · fixed packages · no equity-only"
lede: "How-to articles, knowledge bases, incident copy, and documentation sites — plus virtual tech support by Jump Desktop, and Louisiana Gulf Debug & Drift days for yacht owners who want help without skipping the charter. Rates are for the work, anywhere: senior how-to writing, accessible docs sites, and DNS / mail / endpoint notes a tired first-time user can finish. Remote, hybrid, and on-site at the same floor."

rate_basis: "USD $120 / hour, 4-hour minimum — a competitive independent rate for senior technical writing with accessible front-end and IT-notes literacy in the same brief. Fixed packages below are scoped so you are not buying hours in the dark; they sit on that floor. Invoices in USD; AUD, NZD, or EUR at mid-market if you prefer. Virtual tech support is a Jump Desktop session at that floor. Debug & Drift is Louisiana field work — Slipside Service diagnostic first; you name what the service was worth (parts are always yours to buy). Ask date proposals are hand-built microsites."

virtual_support:
  label: "Request virtual tech support ↗"
  href: "https://app.jumpdesktop.com/invite/277139301"
  note: "Install Jump Desktop Connect, add Jennifer, revoke anytime. Same USD $120 / hour · 4-hour minimum."

specs:
  - label: hourly_rate
    value: "USD $120 · 4-hour minimum"
  - label: rate_basis
    value: "Global freelance floor · the work, not a local salary"
  - label: payment
    value: "PayPal · Wise · USD (AUD / NZD / EUR at mid-market)"
  - label: engagement
    value: "Remote · hybrid · on-site · Louisiana field"
  - label: employment
    value: "Full-time / sponsored roles → see CV"
  - label: availability
    value: "Open for new clients · virtual sessions · ~1 Debug & Drift / week"

rules:
  - "Nothing unpaid — spec work and ‘exposure’ are declined."
  - "Rush timelines billed at 2× for inconvenience."
  - "No equity-only engagements."
  - "No CMS builds, finance products, medical software, ecommerce, or member login."
  - "Human approval on what ships — AI assists; you lead."
  - "Debug & Drift: Slipside Service diagnostic first; client vessel or client-hired charter; parts never included (you buy); service fee is what the day was worth to you — no stamped menu price."
  - "Virtual support: request via the Jump Desktop invite; you install Connect and can revoke access anytime. No password sharing."
  - "Ask date proposals: hand-built from your brief; private unlisted URL."
  - "Documentation: I write the how-tos. You supply product facts and approve the draft. Domain and repo stay yours on docs-site work."

