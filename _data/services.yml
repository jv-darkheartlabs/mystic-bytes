    pitch:
      title: "the screen will not yield"
      lines:
        - "The laptop froze an hour before the meeting. Mail will not send. DNS looks like a storm door. You do not need a yacht day for that — you need someone on the other side of the glass."
        - "Virtual tech support is a Jump Desktop session: you install Connect, add Jennifer, I work the software until it yields or we write the parts list. You keep the keys. You can revoke access when we are done."
        - "Dark Heart Labs is not affiliated with Jump Desktop. I never ask for your password. Parts stay yours to buy."
    access:
      title: "Jump Desktop · grant Jennifer access"
      disclaimer: "Dark Heart Labs is not affiliated with Jump Desktop. UI labels change; if yours looks different, stay on the invite page and follow its steps."
      steps:
        - "Open the invite (button below) on the computer that needs help."
        - "Install Jump Desktop Connect. Skip this step if Connect is already installed."
        - "Add Jennifer as a remote access user when Connect asks."
        - "Stay at the machine until the session starts. Revoke access anytime from Connect when you are done."
      other_registrars: "The invite is for this studio only — Jennifer at Dark Heart Labs. If someone else sent you a Jump link, that is not this service."
    booking:
      label: "Request virtual tech support ↗"
      href: "https://app.jumpdesktop.com/invite/277139301"
      note: "Install Jump Desktop Connect, add Jennifer, revoke anytime. Same USD $120 / hour · 4-hour minimum."
    proof: []
    packages:
      - name: Virtual Session
        price: "USD $120 / hour · 4-hour minimum"
        timeline: "remote · Jump Desktop Connect"
        featured: true
        includes:
          - "Remote session on macOS, Windows, or Linux via Jump Desktop Connect"
          - "Software repair, DNS / mail / endpoint triage, and a short written note of what changed"
          - "You install Connect from the invite; you can revoke Jennifer's access anytime"
