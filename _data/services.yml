tagline: "contract work · fixed packages · no equity-only"
lede: "How-to articles, knowledge bases, incident copy, and documentation sites — plus Louisiana Gulf Debug & Drift days for yacht owners who want tech support without skipping the charter. Rates are for the work, anywhere: senior how-to writing, accessible docs sites, and DNS / mail / endpoint notes a tired first-time user can finish. Remote, hybrid, and on-site at the same floor."

rate_basis: "USD $120 / hour, 4-hour minimum — a competitive independent rate for senior technical writing with accessible front-end and IT-notes literacy in the same brief. Fixed packages below are scoped so you are not buying hours in the dark; they sit on that floor. Invoices in USD; AUD, NZD, or EUR at mid-market if you prefer. Debug & Drift is Louisiana field work — Slipside Service diagnostic first; you name what the service was worth (parts are always yours to buy). Ask date proposals are hand-built microsites."

specs:
  - label: hourly_rate
    value: "USD $120 · 4-hour minimum"
  - label: rate_basis
    value: "Global freelance floor · the work, not a local salary"
  - label: payment
    value: "PayPal · Wise · USD (AUD / NZD / EUR at mid-market)"
  - label: engagement
    value: "Remote · hybrid · on-site · Louisiana field"
  - label: employment
    value: "Full-time / sponsored roles → see CV"
  - label: availability
    value: "Open for new clients · ~1 Debug & Drift / week"

rules:
  - "Nothing unpaid — spec work and ‘exposure’ are declined."
  - "Rush timelines billed at 2× for inconvenience."
  - "No equity-only engagements."
  - "No CMS builds, finance products, medical software, ecommerce, or member login."
  - "Human approval on what ships — AI assists; you lead."
  - "Debug & Drift: Slipside Service diagnostic first; client vessel or client-hired charter; parts never included (you buy); service fee is what the day was worth to you — no stamped menu price."
  - "Ask date proposals: hand-built from your brief; private unlisted URL."
  - "Documentation: I write the how-tos. You supply product facts and approve the draft. Domain and repo stay yours on docs-site work."

realms:
  - id: debug_and_drift
    title: debug & drift
    slug: debug-and-drift
    intent: debug-and-drift
    page_title: "debug & drift — IT on the water"
    badge: FIELD
    section_num: "00"
    summary: "Louisiana Gulf · your yacht or a charter you hire · I fix what plugs in while your guests fish · up to 3–4 computers with advance notice · ~1 booking / week"
    brief:
      subject: "Debug & Drift — Slipside Service / on-vessel support"
      subject_placeholder: "Debug & Drift — marina + date window"
      hint: "Slipside Service first. Louisiana for now · up to 3–4 computers with advance notice · you provision food."
      sections:
        - id: meet
          num: "01"
          title: meet point
          prompt: "Where do we meet the vessel, and whose boat is it?"
          fields:
            - name: marina
              label: "$ marina / meet point"
              type: text
              required: true
              placeholder: "e.g. Venice, Empire, local slip name"
              mail_label: "Marina / meet"
            - name: vessel
              label: "$ vessel"
              type: text
              required: true
              placeholder: "your yacht · or charter you are hiring"
              mail_label: "Vessel"
        - id: devices
          num: "02"
          title: devices
          prompt: "How many machines need hands, with advance notice?"
          fields:
            - name: device_count
              label: "$ device_count"
              type: select
              required: true
              mail_label: "Device count"
              options:
                - value: "1"
                  label: "1 computer"
                - value: "2"
                  label: "2 computers"
                - value: "3"
                  label: "3 computers"
                - value: "4"
                  label: "4 computers"
                - value: "5+"
                  label: "5+ (custom brief)"
        - id: the_day
          num: "03"
          title: the day
          prompt: "Slipside Service only, or on-vessel support — and when?"
          fields:
            - name: day_length
              label: "$ day_length"
              type: select
              required: true
              mail_label: "Day length"
              options:
                - value: "diagnostic"
                  label: "slipside service (diagnostic only)"
                - value: "half"
                  label: "half-day on-vessel support"
                - value: "full"
                  label: "full-day on-vessel support"
                - value: "unsure"
                  label: "not sure yet"
            - name: preferred_window
              label: "$ preferred_window"
              type: text
              required: false
              placeholder: "week of… · weekday · weather-flexible"
              mail_label: "Preferred window"
    pitch:
      title: "charted water, dead screen"
      lines:
        - "Dawn at the slip. The partner's laptop will not wake. The charter is paid for, the tide is moving, and the redfish do not care about your inbox. You are not choosing between love and the line — you are choosing whether shame sits on the gunwale while everyone else casts."
        - "I got you, captain. Debug & Drift puts IT on your vessel or the boat you hire: Slipside Service first, then on-vessel support for a half- or full-day while your people fish. I work what plugs in — MacBooks, Wi‑Fi, the small disasters — until the software yields or we write the parts list you take to the chandlery yourself."
        - "Parts are never on my tab. What you pay for the service is what that peace was worth to you — can anyone really stamp a global price on convenience? Your charter, slip, fuel, and hardware are yours. I bring the hands; you decide what a guilt-free day on the Gulf costs."
    booking:
      label: "Request Debug & Drift →"
      href: "#brief"
      note: "Clarify marina, vessel, devices, and the day — one section at a time."
    proof: []
    packages:
      - name: Slipside Service
        price: "you name what it's worth"
        timeline: "1–2 hours · required before any on-vessel support day"
        includes:
          - "Slip or marina meetup — triage devices, network, and whatever plugs in"
          - "Written go / no-go: software-fixable today vs parts required"
          - "Parts list for anything you need to buy (never included in service; I do not stock hardware)"
        excludes:
          - "Fishing time · motherboard soldering · screen replacement · board-level repair"
          - "On-vessel support day itself (book after Slipside Service clears or after parts arrive)"
          - "Any hardware cost — parts are always client-purchased"
      - name: Half-Day On-Vessel Support
        price: "you name what the half-day is worth"
        timeline: "~4 hours tech capacity · parallel with your charter"
        includes:
          - "Up to 3–4 computers / devices with advance notice — MacBook software repairs and connected gear"
          - "You and guests fish; I work until problems are solved, then I may join the line"
          - "Your yacht or a vessel you charter — I am IT crew, not the captain"
          - "Optional galley prep if you supply the food — catered, dock restaurant, or coolers are fine"
          - "Alcohol at your discretion (BYO / your tab)"
        excludes:
          - "Parts (never included) · food cost · travel beyond the local Gulf day"
          - "Motherboard soldering · screen replacements · more than 4 machines without a custom brief"
          - "Charter hire, fuel, slip, or captain fees (your arrangement)"
      - name: Full-Day On-Vessel Support
        price: "you name what the full-day is worth"
        timeline: "~6–8 hours tech capacity · parallel with your charter"
        includes:
          - "Same scope as Half-Day On-Vessel Support with a full charter window — up to 3–4 computers with advance notice"
          - "Weather / parts pause: if hardware is required, the charter day waits until parts arrive — no soldering, no screen swaps"
          - "Out-of-area yachts: travel and lodging at cost; service fee still at your discretion"
        excludes:
          - "Parts (never included) · food cost · charter vessel hire"
          - "Motherboard soldering · screen replacements · open-ended office IT retainers (see documentation)"

