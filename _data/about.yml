tagline: collaborating brief, working map, availability. credentials live on the cv.
bio: "I write how-tos a tired first-time user can finish. Quiet reflection before visible action — a delayed reply is often the work, not a freeze. Bring the tangled problem early, with the rationale attached. Credentials live on the CV. Availability, and how to work together, live here."
