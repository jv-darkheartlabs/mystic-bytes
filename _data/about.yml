manual:
  warn:
    title: How I might annoy you
    items:
      -
        k: Extra research after a sound path exists
        v: Thoroughness is the default. I will keep verifying unless you set a decision date.
      -
        k: Quiet processing
        v: A delayed reply is often the work, not a freeze. Hyperfocused and quiet does not mean upset.
      -
        k: Softened disagreement
        v: I may hold a technical concern to keep collaboration comfortable. Ask what I would want recorded before this ships.
      -
        k: Harmony tax
        v: Under pressure I absorb extra work or withdraw into research rather than escalate.
  ban:
    title: How you might annoy me
    items:
      -
        k: Surprise urgency
        v: Do not spring a request without priority, impact, or timing.
      -
        k: Questions treated as resistance
        v: Careful questions are how I commit, not how I stall.
      -
        k: Meetings that could be a message
        v: A written update beats another call. Protect the calendar.
      -
        k: Enthusiasm without evidence
        v: Do not sell a path on vibe while omitting tradeoffs.
      -
        k: Unspoken disagreement
        v: Name the gap before it curdles.
      -
        k: Interruptions with no notice
        v: Unplanned shifts make focus expensive to regain. Say what changed, why, and what is still fixed.
  help:
    title: I might need help with
    items:
      -
        k: Cutting the list
        v: Tell me what can wait. I will otherwise try to finish all of it.
      -
        k: A decision date
        v: Protect analysis time, then stop postponing action.
      -
        k: Enough evidence for today
        v: "Ask which proof would be enough to proceed — then ship that slice."
      -
        k: Context before the meeting
        v: Send background and distinguish an initial reaction from a final decision.
      -
        k: Asking for help
        v: I will try to solve it myself first. A calm, specific ping lands better than a pile-on.
  love:
    title: I love
    items:
      -
        k: Tangled problems, early
        v: Bring the mess while several options are still available. Arranging is the work.
      -
        k: Rationale attached
        v: Constraints, evidence, and root cause before you ask for commitment.
      -
        k: Purpose and people impact
        v: Name who it helps and why it is worth the care.
      -
        k: Written checkpoints
        v: Clear deliverables and a next check-in. Status theatre is optional.
      -
        k: Kind, specific feedback
        v: Examples, impact, a next step. In writing or a quiet one-to-one.
      -
        k: Writing that a tired user can finish
        v: Turning a messy Slack thread into a page someone can complete.
quote: "If you're being quiet it means you're thinking. If I'm being quiet it means I'm in flow. Ping me on Discord — I promise I'll resurface."
