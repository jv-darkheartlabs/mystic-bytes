collaborating:
  lede: "Thoughtful structure with room to adapt. I sort complicated technical work into a few workable paths, then rearrange when the evidence changes. Meaningful outcomes, sound reasoning, and care for teammates matter together."
  do_title: Do
  do:
    - Lead with the conclusion, then the reasoning and evidence.
    - Share drafts early, before the solution is hard to reshape.
    - Set decision dates that protect analysis without postponing action.
    - Name what is working before the gaps, risks, or defects.
    - Invite a direct view in a smaller setting and leave time to finish.
  avoid_title: Avoid
  avoid:
    - Springing urgent requests without priority, impact, or timing.
    - Treating careful questions as resistance or lack of commitment.
    - Adding meetings when a written update would suffice.
    - Leaving disagreement unspoken until it has already curdled.
    - Selling an idea on enthusiasm while omitting evidence and tradeoffs.
  tensions:
    -
      title: Harmony versus a clear technical position
      text: "I can see why several viewpoints make sense and may soften a disagreement to keep the room comfortable, even when a firm technical concern is forming. Ask what concern I would want recorded before this ships."
    -
      title: Thoroughness versus timely delivery
      text: "There is a pull to understand the full picture and meet a high internal standard, paired with knowing the team cannot wait for perfect certainty. Set a time boundary and ask which evidence is enough to proceed today."
  pressure:
    title: Under pressure
    see: "I may withdraw into research, revisit details, or quietly absorb extra work to preserve harmony. A delayed response is usually processing, not disengagement."
    help: "Cut the list to the essential work and state what can wait. Name concerns directly and calmly, then leave focused time to regroup."
  feedback:
    title: Feedback
    receiving: "Direct, specific, with examples, impact, and a practical next step — writing or a calm one-to-one. Leave processing time. Connect it to quality and team outcomes; do not turn disagreement into a competence judgment."
    giving: "Thoughtful and candid, aimed at facts, standards, and improvement. Keep the substance. If it lands cool, ask for the human impact. Treat my questions as an effort to understand the work."
